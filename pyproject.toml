[project]
name = "fastapi-blog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib==5.1.2",
    "alembic>=1.18.5",
    "fastapi[standard]==0.139.2",
    "greenlet>=3.3.0",
    "httpx==0.28.1",
    "Pillow==12.3.0",
    "psycopg[binary]>=3.3.3",
    "pwdlib[argon2]>=0.3.0",
    "pwdlib==0.3.0",
    "pydantic==2.13.4",
    "pydantic_settings==2.14.2",
    "PyJWT==2.13.0",
    "pytest==9.0.3",
    "SQLAlchemy==2.0.51",
    "starlette==1.3.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.djlint]
profile = "jinja"
ignore = "H031,J004"